<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>YT 实时翻译字幕</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="banner">
    <span class="logo">YT</span>
    <div>
      <div class="name">YouTube 实时翻译字幕</div>
      <div class="sub-name">本地 Whisper 识别 · 大模型同传</div>
    </div>
    <span class="ver" id="ver">v?</span>
  </div>

  <div class="wrap">
    <div id="statusCard">
      <span id="dot"></span><span id="statusText">未启动</span>
    </div>
    <div id="tabWarn" class="warn hidden">当前标签页不是 YouTube，请先打开直播/视频页面。</div>
    <button id="toggleBtn">开始字幕</button>
    <button id="diagBtn" style="display:none" title="复制最近的引擎状态与错误日志（排查问题时发给开发者）">⧉ 复制诊断</button>

    <div class="card">
      <div class="sec"><span class="ico">识</span>识别</div>
      <label>识别引擎
        <select id="asrEngine">
          <option value="local" selected>本地 Whisper（免费离线，GPU 加速，双管线并行）</option>
          <option value="hybrid">混合并行（本地 GPU + 云端同时跑，延迟最低，云端按量计费）</option>
          <option value="cloud">云端 glm-asr（更准更抗噪，需大模型 Key，按量计费）</option>
        </select>
      </label>
      <div id="cloudHint" class="hint hidden">云端识别复用下方"翻译服务 → 大模型 API"的 Base URL 与 API Key（智谱）。GLM-ASR 对游戏音效/BGM 混杂的直播音频识别明显更准，接口按量计费。</div>
      <label>识别语言（语音源）
        <select id="srcLang">
          <option value="ja">日语</option>
          <option value="auto">自动检测</option>
          <option value="en">英语</option>
          <option value="ko">韩语</option>
          <option value="zh">中文</option>
        </select>
      </label>
      <label id="modelRow">本地模型（首次使用需下载；云端引擎时不使用）
        <select id="model">
          <option value="turbo" selected>最强（large-v3-turbo，约 1.6GB，GPU 首选：精度接近 large、速度快）</option>
          <option value="small">精确（small，约 1GB）</option>
          <option value="base">入门（base，约 400MB；游戏语音/BGM 混杂时经常识别不出，不推荐日常使用）</option>
          <option value="tiny">快速（tiny，约 150MB，CPU 模式唯一能实时跟上的选择）</option>
        </select>
      </label>
      <label id="beamRow" class="switch-row" style="margin-top:6px">
        <input type="checkbox" id="beamSearch">
        <span class="sw-text">精细解码（束搜索：识别更准，速度略降；GPU 好的机器建议开启）</span>
      </label>
      <label>字幕模式
        <select id="mode">
          <option value="complete" selected>完整优先（片段合并成完整句再翻译，不遗漏不割裂）</option>
          <option value="realtime">实时优先（紧跟直播进度，识别忙时跳过部分语句）</option>
        </select>
      </label>
    </div>

    <div class="card">
      <div class="sec"><span class="ico">译</span>翻译</div>
      <label>目标语言
        <select id="tgtLang">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
          <option value="ko">한국어</option>
        </select>
      </label>
      <label>翻译服务（质量依次提升）
        <select id="trProvider">
          <option value="google" selected>Google 免费翻译（无需配置；双通道自动切换，接口限流时暂停 2 分钟）</option>
          <option value="deepl">DeepL（需 API Key，日中翻译质量高）</option>
          <option value="llm">大模型 API（OpenAI 兼容，带上下文，质量最好）</option>
        </select>
      </label>
      <input id="deeplKey" type="password" placeholder="DeepL API Key（free 版以 :fx 结尾）" class="hidden cfg">
      <input id="llmBaseUrl" type="text" placeholder="大模型 Base URL，如 https://open.bigmodel.cn/api/paas/v4" class="hidden cfg">
      <input id="llmKey" type="password" placeholder="大模型 API Key" class="hidden cfg">
      <input id="llmModel" type="text" placeholder="模型名（智谱模型名全小写，会自动转），如 glm-4.7-flash" class="hidden cfg">
      <textarea id="streamContext" rows="3" placeholder="直播背景描述（仅大模型模式生效，越具体翻译越准）：例：彩虹社 VTuber 在玩《生化危机》，游戏有角色台词和恐怖音效；主播语速快爱用网络梗，观众叫她〇〇桑" class="hidden cfg"></textarea>
      <textarea id="glossary" rows="3" placeholder="术语表（每行一条：原文=中文译名，最高优先级，人名/游戏名/称呼必填）：例：&#10;ぺこら=兔田佩克拉&#10;マイクラ=我的世界" class="hidden cfg"></textarea>
      <label style="margin-top:6px" class="hidden" id="translateDetailRow">翻译精细度（仅大模型）
        <select id="translateDetail">
          <option value="quality" selected>精细（意译+碎片合并+示例引导，推荐）</option>
          <option value="fast">快速（精简指令，延迟更低）</option>
        </select>
      </label>
    </div>

    <div class="card">
      <div class="sec"><span class="ico">他</span>其他</div>
      <label>模型下载源
        <select id="dlSource">
          <option value="auto" selected>自动（优先官方，卡住自动换镜像）</option>
          <option value="direct">官方 huggingface.co</option>
          <option value="mirror">国内镜像 hf-mirror.com</option>
        </select>
      </label>
      <label class="switch-row">
        <input type="checkbox" id="playAudio" checked>
        <span class="sw-text">回放标签页声音（捕获时标签页会暂时静音，勾选后由插件回放；若双重声音则取消）</span>
      </label>
    </div>

    <p class="tip"><b>提示</b>：语音识别在本地浏览器完成（Whisper，GPU 加速、双管线并行），仅翻译时联网。快捷键 <b>Ctrl+Shift+Y</b> 开始/停止。字幕面板支持双语/仅中切换、SRT 导出与一键复制。修改设置后需停止并重新开始生效。</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
